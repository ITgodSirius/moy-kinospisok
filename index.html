<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15171d">
  <meta name="description" content="Личный список фильмов и сериалов с датами премьер, расписанием серий и трейлерами.">
  <meta name="history-mode" content="local">
  <title>Мой киносписок</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231443ef'/%3E%3Cpath d='M18 18h28v29L32 38l-14 9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=b2e93d7df0d6">
  <script type="module" src="./app.js?v=aed3d836bdea"></script>
</head>
<body>
  <a class="skip" href="#feed">К фильмам и сериалам</a>
  <header class="masthead">
    <div class="wrap">
      <div class="topline" id="list-navigation">
        <h1>Мой киносписок</h1>
        <nav class="mobile-lists" aria-label="Личные списки">
          <button type="button" data-list="favorite" aria-pressed="false" aria-label="Любимые" title="Любимые"><span data-icon="heart"></span></button>
          <button type="button" data-list="watched" aria-pressed="false" aria-label="Просмотрено" title="Просмотрено"><span data-icon="check"></span></button>
        </nav>
        <nav id="lists" aria-label="Списки">
          <button data-list="waiting" aria-pressed="true">Жду</button>
          <button data-list="available" aria-pressed="false">Новинки</button>
          <span class="list-divider" aria-hidden="true">|</span>
          <button data-list="backlog" aria-pressed="false">Старое</button>
          <button data-list="watching" aria-pressed="false">Смотрю сейчас</button>
          <span class="list-divider list-divider--personal" aria-hidden="true">|</span>
          <button data-list="watched" aria-pressed="false">Просмотрено</button>
          <button data-list="favorite" aria-pressed="false">Любимые</button>
        </nav>
      </div>
      <div class="toolbar">
        <div id="types" class="type-switch" role="group" aria-label="Тип">
          <button data-type="all" aria-pressed="true">Все</button><button data-type="movie" aria-pressed="false">Фильмы</button><button data-type="series" aria-pressed="false">Сериалы</button>
        </div>
        <div class="tools">
          <button id="filters-open" class="quiet" aria-haspopup="dialog"><span data-icon="sliders"></span>Фильтры <span id="filter-count" hidden></span></button>
          <label class="sort"><span class="sr">Сортировка</span>
            <select id="sort">
              <option value="added-new">Сначала новые</option><option value="added-old">Сначала давние</option>
              <option value="rating">По рейтингу</option><option value="release-new">Сначала новые премьеры</option><option value="release-old">Сначала ранние премьеры</option><option value="title">По названию</option>
              <optgroup label="По стране производства">
                <option value="russian-first">Сначала российское</option>
                <option value="foreign-first">Сначала зарубежное</option>
              </optgroup>
            </select><span data-icon="chevron"></span>
          </label>
        </div>
      </div>
    </div>
  </header>
  <main id="feed" tabindex="-1" aria-label="Лента фильмов и сериалов">
    <div class="wrap"><div id="records"><p class="loading">Загрузка каталога…</p></div></div>
  </main>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <div class="dialog-head"><h2 id="edit-title">Изменить отметку</h2><button class="icon-button" data-close aria-label="Закрыть"><span data-icon="close"></span></button></div>
    <form id="edit-form" class="dialog-body field-body">
      <label for="edit-pin">Пароль для редактирования</label>
      <input id="edit-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-describedby="edit-error">
      <p id="edit-error" role="alert"></p>
    </form>
    <div class="dialog-foot">
      <button class="btn" data-close>Отмена</button>
      <button type="submit" form="edit-form" class="btn">Подтвердить</button>
    </div>
  </dialog>
  <dialog id="filters" aria-labelledby="filters-title">
    <div class="dialog-head"><h2 id="filters-title">Фильтры</h2><button class="icon-button" data-close aria-label="Закрыть фильтры"><span data-icon="close"></span></button></div>
    <div class="dialog-body filters-body">
      <label>Страна производства<select id="origin"><option value="">Все страны</option><option value="russian">Российское</option><option value="foreign">Зарубежное</option></select></label>
      <label>Жанр<select id="genre"><option value="">Все</option></select></label>
      <label>Студия или платформа<select id="studio"><option value="">Все</option></select></label>
      <label>Период добавления<select id="period"><option value="">За всё время</option><option value="7">За 7 дней</option><option value="30">За 30 дней</option><option value="365">За год</option></select></label>
      <label>Минимальный рейтинг<select id="minimum"><option value="">Любой</option><option value="5">От 5</option><option value="6">От 6</option><option value="7">От 7</option><option value="8">От 8</option><option value="9">От 9</option></select></label>
    </div>
    <div class="dialog-foot"><button id="clear" class="btn">Сбросить</button><button id="apply" class="btn">Показать</button></div>
  </dialog>
  <dialog id="schedule" aria-labelledby="schedule-title" aria-describedby="series-title">
    <div class="dialog-head"><div><h2 id="schedule-title">Сезоны и серии</h2><p id="series-title"></p></div><button class="icon-button" data-close aria-label="Закрыть расписание"><span data-icon="close"></span></button></div>
    <div id="seasons" class="dialog-body"></div>
  </dialog>
  <noscript>Включите JavaScript, чтобы открыть личный киносписок.</noscript>
</body>
</html>
