<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15171d">
  <meta name="description" content="Личный список фильмов и сериалов с датами премьер, расписанием серий и трейлерами.">
  <meta name="history-mode" content="local">
  <title>Мой киносписок</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231443ef'/%3E%3Cpath d='M18 18h28v29L32 38l-14 9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css?v=041fd6ad2649">
  <script type="module" src="./app.js?v=6497aefafe36"></script>
</head>
<body>
  <a class="skip" href="#feed">К фильмам и сериалам</a>
  <header class="masthead" id="cinema-header">
    <div class="wrap">
      <div class="topline" id="list-navigation">
        <div class="collection-brand">
          <h1><button class="collection-switch" id="open-wishlist" type="button" data-collection="wishlist" aria-label="Мой киносписок. Открыть вишлист" aria-controls="wishlist">Мой киносписок <span class="collection-destination"><span data-icon="swap"></span><span>Вишлист</span></span></button></h1>
          <button type="button" class="collection-destination open-quotes" data-collection="quotes" aria-label="Цитаты" aria-haspopup="dialog" aria-controls="edit-dialog"><span data-icon="lock"></span><span>Цитаты</span></button>
        </div>
        <nav class="mobile-lists" aria-label="Личные списки">
          <button type="button" data-list="favorite" aria-pressed="false" aria-label="Любимые" title="Любимые"><span data-icon="heart"></span></button>
          <button type="button" data-list="watched" aria-pressed="false" aria-label="Просмотрено" title="Просмотрено"><span data-icon="check"></span></button>
        </nav>
        <nav id="lists" aria-label="Списки">
          <button data-list="waiting" aria-pressed="true">Жду</button>
          <button data-list="available" aria-pressed="false">Новинки</button>
          <span class="list-divider" aria-hidden="true">|</span>
          <button data-list="backlog" aria-pressed="false">Старое</button>
          <button data-list="watching" aria-pressed="false">Смотрю сейчас</button>
          <span class="list-divider list-divider--personal" aria-hidden="true">|</span>
          <button data-list="watched" aria-pressed="false">Просмотрено</button>
          <button data-list="favorite" aria-pressed="false">Любимые</button>
        </nav>
      </div>
      <div class="toolbar">
        <div id="types" class="type-switch" role="group" aria-label="Категория">
          <button data-type="all" aria-pressed="true">Все</button>
          <button data-type="movie" aria-pressed="false">Фильмы</button>
          <button data-type="series" aria-pressed="false">Сериалы</button>
          <button data-type="animation" aria-pressed="false">Мультики</button>
          <button data-type="dorama" aria-pressed="false">Дорамы</button>
          <button hidden id="announcements-type" data-type="announcements" aria-pressed="false">Анонсы</button>
        </div>
        <p class="last-update" hidden>Обновлено <time id="site-updated"></time></p>
        <div class="tools">
          <button type="button" id="search-toggle" class="icon-button" aria-label="Поиск по всем разделам киносписка" title="Поиск по всем разделам киносписка" aria-controls="catalog-search" aria-expanded="false"><span data-icon="search"></span></button>
          <button id="filters-open" class="quiet" aria-haspopup="dialog" aria-controls="filters">Фильтры <span id="filter-count" hidden></span><span data-icon="chevron"></span></button>
          <label class="quiet genre-control">Жанры <span data-icon="chevron"></span>
            <select id="genre-select" aria-label="Жанры"><option hidden disabled selected>Жанры</option></select>
          </label>
          <label class="sort"><span class="sr">Сортировка</span>
            <select id="sort">
              <option value="added-new">Сначала новые</option><option value="added-old">Сначала давние</option>
              <option value="rating">По рейтингу</option><option value="release-new">Свежие премьеры</option><option value="release-old">Сначала ранние премьеры</option><option value="title">По названию</option>
              <optgroup label="По стране производства">
                <option value="russian-first">Сначала российское</option>
                <option value="foreign-first">Сначала зарубежное</option>
              </optgroup>
            </select><span data-icon="chevron"></span>
          </label>
          <div id="layouts" class="view-switch" role="group" aria-label="Вид ленты">
            <button type="button" data-layout="list" aria-pressed="true"><span data-icon="list"></span>Список</button>
            <button type="button" data-layout="grid" aria-pressed="false"><span data-icon="grid"></span>Сетка</button>
          </div>
        </div>
        <div id="genres" class="genre-switch" role="group" aria-label="Жанры">
          <div class="genre-strip" id="genre-strip"></div>
        </div>
        <div id="selected-genres" class="genre-badges" role="group" aria-label="Выбранные жанры" hidden></div>
      </div>
      <div id="catalog-search" role="search" aria-label="Поиск по киносписку" hidden>
        <input type="search" id="catalog-query" aria-label="Название фильма или сериала" placeholder="Поиск по всем разделам киносписка" aria-controls="records" autocomplete="off" enterkeyhint="search">
        <button type="button" id="search-close" class="quiet" aria-label="Закрыть поиск">Закрыть</button>
      </div>
    </div>
  </header>
  <main id="feed" tabindex="-1" aria-label="Лента фильмов и сериалов">
    <div class="wrap">
      <p id="search-status" role="status" hidden></p>
      <div id="records"><p class="loading">Загрузка каталога…</p></div>
    </div>
  </main>
  <section id="wishlist" aria-label="Мой вишлист" hidden>
    <header class="masthead">
      <div class="wrap">
        <div class="topline wish-top">
          <div class="collection-brand">
            <h1><button class="collection-switch" id="open-cinema" type="button" data-collection="cinema" aria-label="Мой вишлист. Открыть киносписок" aria-controls="feed">Мой вишлист <span class="collection-destination"><span data-icon="swap"></span><span>Киносписок</span></span></button></h1>
            <button type="button" class="collection-destination open-quotes" data-collection="quotes" aria-label="Цитаты" aria-haspopup="dialog" aria-controls="edit-dialog"><span data-icon="lock"></span><span>Цитаты</span></button>
          </div>
          <nav class="wish-status" id="wish-status" aria-label="Статус желания">
            <button type="button" data-wish-status="wanted" aria-pressed="true">Хочу</button>
            <button type="button" data-wish-status="fulfilled" aria-pressed="false">Сбылось</button>
          </nav>
        </div>
        <div class="toolbar wish-toolbar">
          <div class="type-switch" id="wish-categories" role="group" aria-label="Категории желаний">
            <button type="button" data-wish-category="all" aria-pressed="true">Всё</button>
            <button type="button" data-wish-category="things" aria-pressed="false">Вещи</button>
            <button type="button" data-wish-category="trips" aria-pressed="false">Поездки</button>
            <button type="button" data-wish-category="experiences" aria-pressed="false">Впечатления</button>
            <button type="button" data-wish-category="perfume" aria-pressed="false">Духи</button>
          </div>
          <div class="tools wish-tools">
            <label class="sort wish-sort"><span class="sr">Сортировка желаний</span>
              <select id="wish-sort">
                <option value="added">Сначала новые</option><option value="title">По названию</option>
                <option value="budget">По бюджету</option>
              </select><span data-icon="chevron"></span>
            </label>
            <div id="wish-layouts" class="view-switch wish-view" role="group" aria-label="Вид вишлиста">
              <button type="button" data-wish-layout="list" aria-label="Список" aria-pressed="false"><span data-icon="list"></span><span>Список</span></button>
              <button type="button" data-wish-layout="grid" aria-label="Сетка" aria-pressed="true"><span data-icon="grid"></span><span>Сетка</span></button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main id="wish-feed" tabindex="-1" aria-label="Лента желаний">
      <div class="wrap"><div id="wish-records" class="wish-grid"></div></div>
    </main>
  </section>
  <section id="quotes" aria-label="Мои цитаты" hidden>
    <header class="masthead">
      <div class="wrap">
        <div class="topline quote-top">
          <h1 id="quotes-heading" tabindex="-1">Мои цитаты</h1>
          <nav class="quote-collections" aria-label="Другие разделы">
            <button type="button" class="collection-destination" data-collection="cinema" aria-controls="feed"><span data-icon="swap"></span>Киносписок</button>
            <button type="button" class="collection-destination" data-collection="wishlist" aria-controls="wishlist"><span data-icon="swap"></span>Вишлист</button>
          </nav>
        </div>
        <div class="toolbar quote-toolbar">
          <div class="type-switch" id="quote-categories" role="group" aria-label="Категории цитат">
            <button type="button" data-quote-category="all" aria-pressed="true">Всё</button>
            <button type="button" data-quote-category="film" aria-pressed="false">Фильмы</button>
            <button type="button" data-quote-category="book" aria-pressed="false">Книги</button>
            <button type="button" data-quote-category="heard" aria-pressed="false">Где-то услышал</button>
          </div>
          <label class="quote-search"><span data-icon="search"></span><input id="quote-search" type="search" aria-label="Поиск по цитатам" placeholder="Поиск по цитатам"></label>
        </div>
      </div>
    </header>
    <main id="quote-feed" tabindex="-1" aria-label="Лента цитат">
      <div class="wrap"><div id="quote-records" class="quote-grid"></div></div>
    </main>
  </section>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="wish-details" aria-labelledby="wish-title">
    <div class="dialog-head">
      <div><h2 id="wish-title"></h2><p id="wish-category"></p></div>
      <button class="icon-button" data-close aria-label="Закрыть карточку желания" autofocus><span data-icon="close"></span></button>
    </div>
    <div class="dialog-body wish-detail-body"></div>
    <div class="dialog-foot wish-detail-foot"></div>
  </dialog>
  <dialog id="film-details" aria-labelledby="film-title">
    <div class="dialog-head"><div id="film-heading"></div><button class="icon-button" data-close aria-label="Закрыть карточку" autofocus><span data-icon="close"></span></button></div>
    <div class="dialog-body film-body"></div>
    <div class="dialog-foot film-foot"></div>
  </dialog>
  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <div class="dialog-head"><h2 id="edit-title">Изменить отметку</h2><button class="icon-button" data-close aria-label="Закрыть"><span data-icon="close"></span></button></div>
    <form id="edit-form" class="dialog-body field-body">
      <label for="edit-pin">Пароль из 5 цифр</label>
      <input id="edit-pin" type="password" inputmode="numeric" maxlength="5" autocomplete="off" aria-describedby="edit-error">
      <p id="edit-error" role="alert"></p>
    </form>
    <div class="dialog-foot">
      <button class="btn" data-close>Отмена</button>
      <button type="submit" form="edit-form" class="btn">Подтвердить</button>
    </div>
  </dialog>
  <dialog id="filters" aria-labelledby="filters-title">
    <div class="dialog-head"><h2 id="filters-title">Фильтры</h2><button class="icon-button" data-close aria-label="Закрыть фильтры"><span data-icon="close"></span></button></div>
    <div class="dialog-body filters-body">
      <label>Страна производства<select id="origin"><option value="">Все страны</option><option value="russian">Российское</option><option value="foreign">Зарубежное</option></select></label>
      <label>Студия или платформа<select id="studio"><option value="">Все</option></select></label>
      <label>Период добавления<select id="period"><option value="">За всё время</option><option value="7">За 7 дней</option><option value="30">За 30 дней</option><option value="365">За год</option></select></label>
      <label>Минимальный рейтинг<select id="minimum"><option value="">Любой</option><option value="5">От 5</option><option value="6">От 6</option><option value="7">От 7</option><option value="8">От 8</option><option value="9">От 9</option></select></label>
    </div>
    <div class="dialog-foot"><button id="clear" class="btn">Сбросить</button><button id="apply" class="btn">Показать</button></div>
  </dialog>
  <dialog id="schedule" aria-labelledby="schedule-title" aria-describedby="series-title">
    <div class="dialog-head"><div><h2 id="schedule-title">Сезоны и серии</h2><p id="series-title"></p></div><button class="icon-button" data-close aria-label="Закрыть расписание"><span data-icon="close"></span></button></div>
    <div id="seasons" class="dialog-body"></div>
  </dialog>
  <noscript>Включите JavaScript, чтобы открыть личный киносписок.</noscript>
</body>
</html>
