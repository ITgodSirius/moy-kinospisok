name: Копия истории киносписка
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/watch-history.yml']

permissions:
  contents: write
concurrency:
  group: watch-history-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: watch-history
      - name: Сохранить подтверждённые отметки
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 30 'https://moy-kinospisok-history-sync.simpleclay16.chatgpt.site/history' -o "$RUNNER_TEMP/kino-history.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'kino-history.json').read_text())
          if data.get('version') != 1 or not isinstance(data.get('marks'), list):
              raise ValueError('Некорректная версия истории')
          fields = {'card', 'kind', 'value', 'markedAt'}
          if any(set(mark) != fields for mark in data['marks']):
              raise ValueError('Некорректная отметка')
          path = Path('watch-history.json')
          if json.loads(path.read_text()) != data:
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          if git diff --quiet -- watch-history.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch-history.json
          git commit -m "Сохранить общую историю"
          git push origin HEAD:watch-history
